# main に push されたらビルドして Cloudflare Workers へ配信する。
# プルリクエストではビルド（型チェックを含む）だけを行う。
#
# 必要なリポジトリのシークレット：
#   CLOUDFLARE_API_TOKEN  … 「Edit Cloudflare Workers」テンプレートで作った API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同時に複数の配信が走らないようにする（後から来たものを優先）
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # シークレットは if で直接参照できないので、登録されているかを環境変数に移しておく
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: シークレット未登録の通知
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN が登録されていないため、配信を飛ばしました"

      - name: Cloudflare Workers へ配信
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CLOUDFLARE_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
