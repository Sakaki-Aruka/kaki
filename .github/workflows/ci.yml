# ビルド（型チェックを含む）が通るかだけを確かめる。
# 配信は Cloudflare Workers Builds（Cloudflare 側の Git 連携）が push を受けて行うので、ここでは行わない。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build
